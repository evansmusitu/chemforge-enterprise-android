plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'ai.chemforge.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.chemforge.mobile'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.3.0-alpha'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    def trustedKey = System.getenv('CHEMFORGE_PACK_PUBLIC_KEY_BASE64') ?: ''
    def requireProvisioning = System.getenv('CHEMFORGE_REQUIRE_PROVISIONING') == 'true'
    if (requireProvisioning && !trustedKey.matches('[A-Za-z0-9+/=]{80,}')) {
        throw new GradleException('Enterprise provisioning requires CHEMFORGE_PACK_PUBLIC_KEY_BASE64 at build time')
    }
    defaultConfig {
        buildConfigField 'boolean', 'REQUIRE_ENTERPRISE_PROVISIONING', requireProvisioning.toString()
        // Public key only. Never embed a private signing key in this repository.
        buildConfigField 'String', 'CONTENT_PUBLIC_KEY_B64', '\"' + trustedKey + '\"'
    }
    def approvedModelHash = System.getenv('CHEMFORGE_APPROVED_MODEL_SHA256') ?: ''
    if (approvedModelHash && !approvedModelHash.matches('[a-fA-F0-9]{64}')) {
        throw new GradleException('Invalid CHEMFORGE_APPROVED_MODEL_SHA256: expected 64 hex characters')
    }
    defaultConfig {
        buildConfigField 'String', 'APPROVED_MODEL_SHA256', '\"' + approvedModelHash + '\"'
    }
    buildTypes {
        release {
            minifyEnabled false
            // A release APK must be signed with a private production key.
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

// Model executes in the app process. No API keys, cloud backend, or INTERNET permission.
// Pin exact runtime version to make build inputs reproducible.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
