name: CHEMFORGE disposable PostgreSQL security qualification
on:
  push:
    paths:
      - 'control_plane/**'
      - 'tests/postgresql/**'
      - 'tools/postgres_restore_drill.py'
      - 'tools/postgres_role_gate.py'
      - 'tools/postgres_login_gate.py'
      - 'tools/postgres_tenant_rls_gate.py'
      - 'tools/postgres_app_rls_gate.py'
      - 'tools/postgres_tenant_session_gate.py'
      - '.github/workflows/postgres-synthetic-qualification.yml'
  pull_request:
    paths:
      - 'control_plane/**'
      - 'tests/postgresql/**'
      - 'tools/postgres_restore_drill.py'
      - 'tools/postgres_role_gate.py'
      - 'tools/postgres_login_gate.py'
      - 'tools/postgres_tenant_rls_gate.py'
      - 'tools/postgres_app_rls_gate.py'
      - 'tools/postgres_tenant_session_gate.py'
      - '.github/workflows/postgres-synthetic-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chemforge_synthetic
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_real_secret
          POSTGRES_DB: chemforge_synthetic
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U chemforge_synthetic -d chemforge_synthetic"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CHEMFORGE_STORAGE_BACKEND: postgres_synthetic
      CHEMFORGE_POSTGRES_SYNTHETIC_ONLY: I_ACKNOWLEDGE_DISPOSABLE_SYNTHETIC_DATABASE_ONLY
      CHEMFORGE_PG_DSN: postgresql://chemforge_synthetic:synthetic_ci_only_not_a_real_secret@127.0.0.1:5432/chemforge_synthetic?sslmode=disable
      CHEMFORGE_PG_CI: '1'
      CHEMFORGE_PG_RESTORE_DSN: postgresql://chemforge_synthetic:synthetic_ci_only_not_a_real_secret@127.0.0.1:5432/chemforge_synthetic_restore?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CI-only Postgres adapter dependencies
        run: python -m pip install -r control_plane/requirements.txt 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - name: Confirm safe backend configuration and disposable database permission regressions
        run: python -m pytest -q tests/deployment/test_pg_login_gate_v30.py tests/postgresql --ignore=tests/postgresql/test_postgres_tenant_rls_v31.py --ignore=tests/postgresql/test_postgres_app_rls_v32.py
      - name: Provision separate *empty* disposable restore database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CHEMFORGE_PG_RESTORE_DSN: postgresql://chemforge_synthetic:synthetic_ci_only_not_a_real_secret@127.0.0.1:5432/chemforge_synthetic_restore?sslmode=disable
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" createdb --username=chemforge_synthetic chemforge_synthetic_restore
          python -m tools.postgres_restore_drill --phase preflight
      - name: Native PostgreSQL 17 custom-format backup and single-transaction restore
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/chemforge-synthetic-native"
          docker exec "$PG_CONTAINER" pg_dump --version
          docker exec "$PG_CONTAINER" pg_dump --username=chemforge_synthetic \
            --dbname=chemforge_synthetic --format=custom --no-owner --no-acl \
            > "$RUNNER_TEMP/chemforge-synthetic-native/disposable.backup"
          test -s "$RUNNER_TEMP/chemforge-synthetic-native/disposable.backup"
          docker exec -i "$PG_CONTAINER" pg_restore --username=chemforge_synthetic \
            --dbname=chemforge_synthetic_restore --single-transaction \
            --exit-on-error --no-owner --no-acl \
            < "$RUNNER_TEMP/chemforge-synthetic-native/disposable.backup"
      - name: Independently match restored rows, schema and indexes
        env:
          CHEMFORGE_PG_RESTORE_DSN: postgresql://chemforge_synthetic:synthetic_ci_only_not_a_real_secret@127.0.0.1:5432/chemforge_synthetic_restore?sslmode=disable
        run: python -m tools.postgres_restore_drill --phase verify
      - name: Prove authenticated PostgreSQL tenant row-level isolation (isolated probe only)
        run: python -m pytest -q tests/deployment/test_pg_tenant_rls_gate_v31.py tests/postgresql/test_postgres_tenant_rls_v31.py
      - name: Prove app-table RLS and per-request tenant-bound database login separation
        run: python -m pytest -q tests/deployment/test_pg_app_rls_gate_v32.py tests/deployment/test_tenant_session_gate_v33.py tests/postgresql/test_postgres_app_rls_v32.py
      - name: Delete ephemeral backup file even on test failure
        if: always()
        run: rm -f "$RUNNER_TEMP/chemforge-synthetic-native/disposable.backup"
      - name: Check prohibited public/real-data deployment contract remains disabled
        run: python tools/zero_budget_gate.py --contract deployment/zero_budget_contract.json
