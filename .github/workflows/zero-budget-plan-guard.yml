name: CHEMFORGE $0 non-deployment plan guard
on:
  push:
    paths:
      - 'deployment/zero_budget_contract.json'
      - 'deployment/neon_synthetic_staging_evidence_v27.json'
      - 'docs/ZERO_DOLLAR_DEPLOYMENT_DECISION.md'
      - 'docs/NEON_SYNTHETIC_STAGING_v2.7.md'
      - 'tools/zero_budget_gate.py'
      - 'tools/neon_staging_gate.py'
      - 'tools/neon_tls_preflight.py'
      - 'tools/postgres_tenant_session_gate.py'
      - 'tests/deployment/test_zero_budget_gate.py'
      - 'tests/deployment/test_neon_staging_v27.py'
      - 'tests/deployment/test_neon_tls_preflight_v28.py'
      - 'docs/NEON_TLS_PREFLIGHT_v2.8.md'
      - '.github/workflows/zero-budget-plan-guard.yml'
  pull_request:
    paths:
      - 'deployment/zero_budget_contract.json'
      - 'deployment/neon_synthetic_staging_evidence_v27.json'
      - 'docs/ZERO_DOLLAR_DEPLOYMENT_DECISION.md'
      - 'docs/NEON_SYNTHETIC_STAGING_v2.7.md'
      - 'tools/zero_budget_gate.py'
      - 'tools/neon_staging_gate.py'
      - 'tools/neon_tls_preflight.py'
      - 'tools/postgres_tenant_session_gate.py'
      - 'tests/deployment/test_zero_budget_gate.py'
      - 'tests/deployment/test_neon_staging_v27.py'
      - 'tests/deployment/test_neon_tls_preflight_v28.py'
      - 'docs/NEON_TLS_PREFLIGHT_v2.8.md'
      - '.github/workflows/zero-budget-plan-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-plan-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned testing dependency
        run: python -m pip install 'pytest==9.0.2'
      - name: Run $0 synthetic-only plan regressions
        run: python -m pytest -q tests/deployment
      - name: Validate historical locked Neon attestation (offline)
        run: python tools/neon_staging_gate.py --evidence deployment/neon_synthetic_staging_evidence_v27.json
      - name: Reject unsafe remote TLS profiles without network access
        env:
          CHEMFORGE_NEON_TLS_DRY_RUN_DSN: 'postgresql://chemforge_synthetic:FAKE_TEST_PWD_NEVER_USE_123456@ep-chemforge-example.c-7.us-east-2.aws.neon.tech:5432/chemforge_synthetic?sslmode=verify-full&sslrootcert=system'
        run: |
          python -m tools.neon_tls_preflight > /tmp/chemforge-tls-profile.json
          python - <<'PY_CHECK'
          import json
          p = json.load(open('/tmp/chemforge-tls-profile.json'))
          assert p['status'] == 'TLS_PROFILE_VALID_NOT_CONNECTED'
          assert p['connection_attempted'] is False
          assert p['certificate_verified'] is False
          assert p['deployment_allowed'] is False
          assert p['real_student_data_allowed'] is False
          PY_CHECK
      - name: Check fail-closed $0 contract
        run: python tools/zero_budget_gate.py --contract deployment/zero_budget_contract.json
      - name: Verify deployment attempt remains blocked
        shell: bash
        run: |
          if python tools/zero_budget_gate.py --request-deploy > /tmp/deploy-gate-result.txt; then
            echo 'ERROR: provider deployment was unexpectedly allowed' >&2
            exit 1
          fi
          grep -q 'BLOCKED' /tmp/deploy-gate-result.txt
