name: Verify and build CHEMFORGE Enterprise v1.3 (offline debug)
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'app/src/androidTest/**'
      - '.github/workflows/android-debug-apk.yml'
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHEMFORGE_PACK_PUBLIC_KEY_BASE64: ${{ secrets.CHEMFORGE_PACK_PUBLIC_KEY_BASE64 }}
      CHEMFORGE_APPROVED_MODEL_SHA256: ${{ secrets.CHEMFORGE_APPROVED_MODEL_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific packaging dependency
        run: python -m pip install 'cryptography>=43,<50'
      - name: Verify offline learning and assessment JavaScript
        run: node --test tests/*.test.cjs
      - name: Verify signed-package publisher and managed-policy guards
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify AES-256-GCM record encryption without Android SDK
        run: |
          mkdir -p /tmp/chemforge-record-crypto
          javac -d /tmp/chemforge-record-crypto app/src/main/java/ai/chemforge/mobile/RecordCipher.java tests/RecordCipherHarness.java
          java -cp /tmp/chemforge-record-crypto RecordCipherHarness
      - name: Verify enterprise provisioning rules with portable JVM harness
        run: |
          mkdir -p /tmp/chemforge-entitlement-gate
          javac -d /tmp/chemforge-entitlement-gate app/src/main/java/ai/chemforge/mobile/EnterpriseEntitlements.java tests/EntitlementsHarness.java
          java -cp /tmp/chemforge-entitlement-gate EntitlementsHarness
      - name: Verify pure Java ECDSA content checks
        run: |
          mkdir -p /tmp/chemforge-verifier
          javac -d /tmp/chemforge-verifier app/src/main/java/ai/chemforge/mobile/SignedContentVerifier.java tests/ContentVerifierHarness.java
          java -cp /tmp/chemforge-verifier ContentVerifierHarness
      - name: Check Android source policies
        run: python tests/check_package.py
      - name: Verify secure offline-record migration in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
          python tests/secure_storage_smoke.py
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, lint, and verify offline Android APK
        run: bash scripts/build_debug_apk.sh
      - name: Archive debug APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: CHEMFORGE-Enterprise-v1.3-offline-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
