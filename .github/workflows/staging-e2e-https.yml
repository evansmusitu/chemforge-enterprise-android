name: CHEMFORGE v1.9 synthetic HTTPS Android-to-teacher E2E
on:
  workflow_dispatch:
  push:
    paths:
      - 'control_plane/**'
      - 'app/**'
      - 'tests/integration/**'
      - '.github/workflows/staging-e2e-https.yml'
permissions:
  contents: read
jobs:
  staging-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and control service dependencies
        run: |
          python -m pip install -r control_plane/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Exercise real HTTPS against disposable FastAPI service
        run: python -m pytest -q tests/integration/test_staging_https.py
      - name: Provision isolated synthetic CA and student/teacher credentials
        shell: bash
        run: |
          set -euo pipefail
          STAGING_DIR="$RUNNER_TEMP/chemforge-v19-staging"
          echo "STAGING_DIR=$STAGING_DIR" >> "$GITHUB_ENV"
          python -m tests.integration.staging_https prepare --dir "$STAGING_DIR"
          mkdir -p app/src/androidTest/assets
          cp "$STAGING_DIR/staging-cert.pem" app/src/androidTest/assets/ci_staging_cert.pem
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'chemforge-v19-staging'
          b=json.loads((d/'fixture.json').read_text())
          permitted={k:b[k] for k in ('tenant','token','revoked_token','foreign_token','backup')}
          p=pathlib.Path('app/src/androidTest/assets/ci_staging_fixture.json')
          p.write_text(json.dumps(permitted))
          p.chmod(0o600)
          PY
      - name: Run real HTTPS staging at emulator host port 443
        shell: bash
        run: |
          set -euo pipefail
          # Only the temporary GitHub runner is exposed. No persistent public staging URL.
          sudo -E env CHEMFORGE_CONTROL_DB="$STAGING_DIR/synthetic.sqlite" "$(command -v python)" -m uvicorn control_plane.app:create_app --factory --host 127.0.0.1 --port 443 --ssl-certfile "$STAGING_DIR/staging-cert.pem" --ssl-keyfile "$STAGING_DIR/staging-key.pem" --no-access-log >"$STAGING_DIR/server.log" 2>&1 &
          echo $! > "$STAGING_DIR/server.pid"
          for n in $(seq 1 50); do
            if curl -fsS --cacert "$STAGING_DIR/staging-cert.pem" https://127.0.0.1/health > /dev/null; then exit 0; fi
            sleep 0.25
          done
          echo 'HTTPS staging startup failed'; tail -25 "$STAGING_DIR/server.log"; exit 1
      - name: Build connected app and connected instrumentation APK
        env:
          CHEMFORGE_SYNC_HOST: 10.0.2.2
        run: |
          gradle :app:assembleConnected :app:assembleConnectedAndroidTest -PchemforgeConnectedTest=true --no-daemon --stacktrace
          bash scripts/verify_connected_apk.sh app/build/outputs/apk/connected/app-connected.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            CHEMFORGE_SYNC_HOST=10.0.2.2 gradle :app:connectedConnectedAndroidTest -PchemforgeConnectedTest=true --no-daemon --stacktrace
      - name: Verify Android upload in teacher dashboard and tenant separation
        run: python -m tests.integration.staging_https verify --dir "$STAGING_DIR" --url https://127.0.0.1
      - name: Verify real HTTPS teacher dashboard in Chromium
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
          python -m tests.integration.verify_teacher_browser --dir "$STAGING_DIR" --url https://127.0.0.1 --screenshot "$RUNNER_TEMP/chemforge-v19-dashboard.png"
      - name: Preserve only non-sensitive test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemforge-v19-synthetic-android-https-tests
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            ${{ runner.temp }}/chemforge-v19-dashboard.png
      - name: Erase ephemeral credentials, CA key, fixture and test APK
        if: always()
        run: |
          sudo rm -rf "${STAGING_DIR:-/tmp/no-such-chemforge-directory}"
          rm -f app/src/androidTest/assets/ci_staging_fixture.json app/src/androidTest/assets/ci_staging_cert.pem
