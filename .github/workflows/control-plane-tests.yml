name: CHEMFORGE Control tenant-isolation tests
on:
  push:
    paths:
      - 'control_plane/**'
      - 'tests/control_plane/**'
      - '.github/workflows/control-plane-tests.yml'
  pull_request:
    paths:
      - 'control_plane/**'
      - 'tests/control_plane/**'
      - '.github/workflows/control-plane-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r control_plane/requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify admin console JavaScript syntax
        run: node --check control_plane/console/app.js
      - name: Verify tenant separation and offline backup import
        run: python -m pytest -q tests/control_plane
      - name: Confirm API document compiles
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from tempfile import TemporaryDirectory
          from control_plane.app import create_app
          with TemporaryDirectory() as temp:
              client = TestClient(create_app(temp + '/test.sqlite'))
              assert client.get('/openapi.json').status_code == 200
              print('OpenAPI: PASS')
          PY
